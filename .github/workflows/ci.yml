name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx eslint .
      - run: bunx vitest run
      # Checks the whole eval pipeline with canned replies; real runs need the gateway key.
      - run: bun run evals --dry-run
      - run: bun run build
